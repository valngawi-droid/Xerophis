# Xerophis — VPS deployment (spec 07/72/73)
# App berjalan di adapter PostgreSQL (DB_DRIVER=postgres); volume sqlite
# tetap tersedia untuk mode dev lokal.
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      PORT: "8080"
      HOST: "0.0.0.0"
      DB_DRIVER: postgres
      DATABASE_URL: postgres://xerophis:xerophis@db:5432/xerophis
    volumes:
      - xerophis-data:/srv/app/data
      - ./app/public:/srv/app/public
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: xerophis
      POSTGRES_PASSWORD: xerophis
      POSTGRES_DB: xerophis
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xerophis -d xerophis"]
      interval: 5s
      timeout: 3s
      retries: 24

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx-ssl.conf:/etc/nginx/conf.d/ssl.conf:ro
      - ./deploy/tls:/etc/nginx/tls:ro
    depends_on:
      - app

volumes:
  xerophis-data:
  pg-data:
