version: "3.9"

# Xerophis — full-stack messaging platform.
# NOTE: The app runs on SQLite by default for zero-setup local dev (see
# DATA_DIR / DATABASE_FILE). For production on a VPS the postgres service below
# is provided; switching requires setting DATABASE_URL and using the Prisma
# schema in prisma/schema.prisma (see README "PostgreSQL"). Both paths keep
# persistent volumes, so data survives restarts.

services:
  web:
    build: .
    container_name: xerophis-web
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATA_DIR=/app/data
      - UPLOAD_DIR=/app/data/uploads
      - AUTH_SECRET=${AUTH_SECRET:-}
      - DATABASE_URL=postgresql://xerophis:xerophis@db:5432/xerophis
      - PUBLIC_URL=${PUBLIC_URL:-http://69.33.213.153}
    env_file:
      - .env
    volumes:
      - xerophis-data:/app/data
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - db
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5

  db:
    image: postgres:16-alpine
    container_name: xerophis-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=xerophis
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-xerophis}
      - POSTGRES_DB=xerophis
    volumes:
      - xerophis-pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  realtime:
    build: .
    container_name: xerophis-realtime
    command: node server/realtime-ws.mjs
    restart: unless-stopped
    environment:
      - REALTIME_PORT=3001
    env_file:
      - .env
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      - web

  nginx:
    image: nginx:1.27-alpine
    container_name: xerophis-nginx
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web
      - realtime

volumes:
  xerophis-data:
  xerophis-pgdata:
