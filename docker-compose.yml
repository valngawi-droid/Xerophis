# Xerophis — VPS deployment (spec 07/72/73)
# App berjalan di adapter PostgreSQL (DB_DRIVER=postgres); volume sqlite
# tetap tersedia untuk mode dev lokal.
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      PORT: "8080"
      HOST: "0.0.0.0"
      DB_DRIVER: postgres
      DATABASE_URL: postgres://xerophis:xerophis@db:5432/xerophis
    volumes:
      - xerophis-data:/srv/app/data
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: xerophis
      POSTGRES_PASSWORD: xerophis
      POSTGRES_DB: xerophis
    volumes:
      - pg-data:/var/lib/postgresql/data

  nginx:
    image: nginx:1.7-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  xerophis-data:
  pg-data:
