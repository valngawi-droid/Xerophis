# Xerophis reverse proxy — HTTP/HTTPS.
# Bind to the VPS public IP 69.33.213.153. Enable HTTPS with certbot, then
# uncomment the 443 server block and point the domain (or IP) to this server.

upstream xerophis_web {
    server 127.0.0.1:3000;
}
upstream xerophis_realtime {
    server 127.0.0.1:3001;
}

# Redirect any hostname/IP to the canonical server.
server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 25M;

    # Health check
    location = /health {
        proxy_pass http://xerophis_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/realtime {
        proxy_pass http://xerophis_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location /ws {
        proxy_pass http://xerophis_realtime;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /api/upload/ {
        proxy_pass http://xerophis_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        expires max;
    }

    location / {
        proxy_pass http://xerophis_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

